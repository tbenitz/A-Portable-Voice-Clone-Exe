name: Build portable studio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install inference, ASR, audio and GUI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python scripts/fetch_inference.py
          python -m py_compile run_studio.py studio/app.py studio/core.py studio/upstream_reader.py pocket_tts_onnx.py
      - name: Run portable voice studio regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows folder
        shell: pwsh
        run: >
          pyinstaller --clean --noconfirm --onedir --windowed
          --name VoiceCloneStudio
          --paths .
          --hidden-import pocket_tts_onnx
          --collect-all onnxruntime
          --collect-all sentencepiece
          --collect-all safetensors
          --collect-all huggingface_hub
          --collect-all scipy
          --collect-all sounddevice
          --collect-all soundfile
          --collect-all imageio_ffmpeg
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          --collect-all pynput
          --collect-all pystray
          --collect-all PIL
          run_studio.py
      - name: Check Windows executable startup without console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/VoiceCloneStudio/VoiceCloneStudio.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable self-test failed: $($process.ExitCode)" }
          $marker = 'dist/VoiceCloneStudio/VoiceData/runtime-self-test.json'
          if (-not (Test-Path $marker)) { throw "Self-test marker missing: $marker" }
          Get-Content $marker
      - name: Include usage information
        shell: pwsh
        run: |
          Copy-Item README.md dist/VoiceCloneStudio/README.md
          New-Item -ItemType Directory -Force -Path dist/VoiceCloneStudio/VoiceData | Out-Null
          Set-Content -Path dist/VoiceCloneStudio/VoiceData/README.txt -Value 'Portable data and cached model weights are saved here on first launch.'
      - uses: actions/upload-artifact@v4
        with:
          name: Portable-Voice-Clone-Windows-x64
          path: dist/VoiceCloneStudio/
          retention-days: 30
          compression-level: 0
